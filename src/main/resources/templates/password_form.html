<html layout:decorate="~{layout}">
<head>
    <title>비밀번호 변경</title>
</head>
<div layout:fragment="content" class="container my-3">
    <div class="my-3 border-bottom">
        <h4>비밀번호 변경</h4>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}">비밀번호가 변경되었습니다.</div>
    <form th:action="@{/user/password}" th:object="${form}" method="post">
        <!-- 변경(수정)이므로 PUT -->
        <input type="hidden" name="_method" value="PUT">
        <th:block th:replace="~{form_errors :: formErrorsFragment}"></th:block>
        <div class="mb-3">
            <label class="form-label w-100">현재 비밀번호
                <input type="password" th:field="*{currentPassword}" class="form-control" autofocus>
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">새 비밀번호
                <input type="password" th:field="*{newPassword1}" class="form-control">
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">새 비밀번호 확인
                <input type="password" th:field="*{newPassword2}" class="form-control">
            </label>
        </div>
        <button type="submit" class="btn btn-primary">변경하기</button>
    </form>
</div>
</html>
