<html layout:decorate="~{layout}">
<head>
    <title>질문 목록</title>
</head>
<div layout:fragment="content" class="container my-3">
    <div class="row my-3">
        <div class="col-6">
            <a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
        </div>
        <div class="col-6">
            <!-- GET 폼: 검색은 조회이므로 GET. 전송하면 /question/list?kw=검색어 (page는 0부터 다시) -->
            <form th:action="@{/question/list}" method="get" class="input-group">
                <input type="text" name="kw" class="form-control" th:value="${kw}" placeholder="검색어">
                <button class="btn btn-outline-secondary" type="submit">찾기</button>
            </form>
        </div>
    </div>
    <table class="table">
        <thead class="table-dark">
        <tr class="text-center">
            <th>번호</th>
            <th style="width:50%">제목</th>
            <th>글쓴이</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!-- paging은 Page 객체. 현재 페이지의 질문들은 paging의 content(=iterator)로 순회된다. -->
        <tr th:each="question, loop : ${paging}">
            <!-- 번호 = 전체 개수 - (현재 페이지 * 페이지 크기) - 현재 페이지 안에서의 인덱스 (교재 3-03) -->
            <td th:text="${paging.totalElements - (paging.number * paging.size) - loop.index}">1</td>
            <td>
                <!-- @{...}: URL 생성, |...|: 문자열 안에 변수 치환 (14163 35강) -->
                <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}">제목</a>
                <!-- 답변이 있을 때만 개수 표시 (교재 3-04) -->
                <span class="text-danger small ms-2"
                      th:if="${#lists.size(question.answers) > 0}"
                      th:text="${#lists.size(question.answers)}">2</span>
            </td>
            <!-- ?. : author가 null이어도 에러 없이 빈 값 (14168 16강) -->
            <td th:text="${question.author?.username}">user1</td>
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
        </tr>
        </tbody>
    </table>
    <!-- 페이징 (교재 3-02). 페이지를 옮겨도 검색어(kw)가 유지되도록 링크에 함께 넣는다. -->
    <nav th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/question/list(page=${paging.number - 1}, kw=${kw})}">이전</a>
            </li>
            <!-- 현재 페이지 앞뒤로 5페이지씩만 보여준다. -->
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{/question/list(page=${page}, kw=${kw})}">1</a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/question/list(page=${paging.number + 1}, kw=${kw})}">다음</a>
            </li>
        </ul>
    </nav>
</div>
</html>
