<html layout:decorate="~{layout}">
<head>
    <title>질문 목록</title>
</head>
<div layout:fragment="content" class="container my-3">
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <!-- paging은 Page 객체. 현재 페이지의 질문들은 paging의 content(=iterator)로 순회된다. -->
        <tr th:each="question, loop : ${paging}">
            <td th:text="${loop.count}">1</td>
            <td>
                <!-- @{...}: URL 생성, |...|: 문자열 안에 변수 치환 (14163 35강) -->
                <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}">제목</a>
            </td>
            <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
        </tr>
        </tbody>
    </table>
    <!-- 페이징 (교재 3-02) -->
    <nav th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">이전</a>
            </li>
            <!-- 현재 페이지 앞뒤로 5페이지씩만 보여준다. -->
            <li th:each="page : ${#numbers.sequence(0, paging.totalPages - 1)}"
                th:if="${page >= paging.number - 5 and page <= paging.number + 5}"
                th:classappend="${page == paging.number} ? 'active'"
                class="page-item">
                <a th:text="${page + 1}" class="page-link" th:href="@{|?page=${page}|}">1</a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">다음</a>
            </li>
        </ul>
    </nav>
    <a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
</div>
</html>
