<!-- 모든 페이지 상단에 들어가는 내비게이션 바 (교재 3-01) -->
<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">SBB</a>
        <!-- 화면이 좁으면 메뉴를 햄버거 버튼으로 접는다. (bootstrap.bundle.js 필요) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/question/list}">질문 목록</a>
                </li>
                <li class="nav-item" th:each="c : ${categories}">
                    <a class="nav-link" th:href="@{/question/list(category=${c.code})}" th:text="${c.name}">질문답변</a>
                </li>
            </ul>
            <ul class="navbar-nav mb-2 mb-lg-0">
                <!-- sec:authorize: 로그인 상태에 따라 보이는 메뉴가 달라진다. (thymeleaf-extras-springsecurity) -->
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/user/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/user/signup}">회원가입</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/user/profile}" sec:authentication="name">user1</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <!-- 로그아웃은 POST 요청이어야 한다. global.js가 a[method]를 폼 전송으로 바꿔 준다. -->
                    <a class="nav-link" method="POST" th:href="@{/user/logout}">로그아웃</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
