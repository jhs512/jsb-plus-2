<html layout:decorate="~{layout}">
<head>
    <title>비밀번호 찾기</title>
</head>
<div layout:fragment="content" class="container my-3">
    <div class="my-3 border-bottom">
        <h4>비밀번호 찾기</h4>
    </div>
    <p class="text-secondary">가입할 때 등록한 이메일로 임시 비밀번호를 보내드립니다.</p>
    <form th:action="@{/user/password/reset}" th:object="${form}" method="post">
        <th:block th:replace="~{form_errors :: formErrorsFragment}"></th:block>
        <div class="mb-3">
            <label class="form-label w-100">이메일
                <input type="email" th:field="*{email}" class="form-control" autofocus>
            </label>
        </div>
        <button type="submit" class="btn btn-primary">임시 비밀번호 받기</button>
    </form>
</div>
</html>
