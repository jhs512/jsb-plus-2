<html layout:decorate="~{layout}">
<head>
    <title>회원가입</title>
</head>
<div layout:fragment="content" class="container my-3">
    <div class="my-3 border-bottom">
        <h4>회원가입</h4>
    </div>
    <form th:action="@{/user/signup}" th:object="${form}" method="post">
        <th:block th:replace="~{form_errors :: formErrorsFragment}"></th:block>
        <div class="mb-3">
            <label class="form-label w-100">사용자ID
                <input type="text" th:field="*{username}" class="form-control" autofocus>
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">비밀번호
                <input type="password" th:field="*{password1}" class="form-control">
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">비밀번호 확인
                <input type="password" th:field="*{password2}" class="form-control">
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">이메일
                <input type="email" th:field="*{email}" class="form-control">
            </label>
        </div>
        <button type="submit" class="btn btn-primary">회원가입</button>
    </form>
</div>
</html>
