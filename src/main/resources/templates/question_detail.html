<html layout:decorate="~{layout}">
<head>
    <title>질문 상세</title>
</head>
<div layout:fragment="content" class="container my-3">
    <!-- 질문 -->
    <h2 class="border-bottom py-2">
        <span class="badge text-bg-light fs-6 align-middle" th:if="${question.category != null}"
              th:text="${question.category.name}">질문답변</span>
        <span th:text="${question.subject}">제목</span>
    </h2>
    <div class="card my-3">
        <div class="card-body">
            <!-- white-space: pre-line -> 입력한 줄바꿈을 그대로 보여준다. (14168 29강) -->
            <!-- th:utext: HTML을 이스케이프하지 않고 그대로 출력 (14168 16강) -> 마크다운이 만든 HTML이 렌더링된다. -->
            <div class="card-text" th:utext="${markdown.render(question.content)}">내용</div>
            <div class="d-flex justify-content-end">
                <!-- 생성 후 수정된 적이 있을 때만 수정일시 표시 (교재 3-09) -->
                <div class="badge bg-light text-dark p-2 text-start mx-3"
                     th:if="${question.modifyDate.isAfter(question.createDate)}">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${question.author?.username}">user1</div>
                    <div class="mb-2" th:text="|조회 ${question.viewCount}|">조회 0</div>
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <!-- 본인 글일 때만 수정, 삭제 버튼 -->
            <div class="my-3">
                <!-- 추천: POST 요청 (global.js), 추천 수 = voters 크기 -->
                <a th:href="@{|/question/vote/${question.id}|}" method="POST"
                   onclick="return confirm('정말로 추천하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">
                    추천 <span class="badge rounded-pill bg-success" th:text="${#lists.size(question.voters)}">0</span>
                </a>
            </div>
            <div class="my-3" sec:authorize="isAuthenticated()"
                 th:if="${question.author != null and #authentication.name == question.author.username}">
                <a th:href="@{|/question/modify/${question.id}|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <!-- method="DELETE": global.js가 DELETE 요청으로 보낸다. confirm에서 취소하면 전송 안 함 -->
                <a th:href="@{|/question/delete/${question.id}|}" method="DELETE"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">삭제</a>
            </div>
            <div th:replace="~{comment_fragment :: commentsFragment(${question}, @{|/comment/create/question/${question.id}|})}"></div>
        </div>
    </div>
    <!-- 답변 개수 -->
    <!-- question.answers: OneToMany 필드라 answerRepository 없이 바로 꺼낼 수 있다. (14163 9강) -->
    <div class="d-flex justify-content-between align-items-center border-bottom my-3 py-2">
        <h5 class="m-0" th:text="|${answerPaging.totalElements}개의 답변이 있습니다.|">0개의 답변이 있습니다.</h5>
        <!-- 정렬 선택: select[value]는 global.js가 현재 값을 선택해 준다. (14168 42강) -->
        <form method="get" class="d-flex gap-2">
            <select name="answerSort" th:value="${answerSort}" class="form-select form-select-sm"
                    onchange="this.form.submit();">
                <option value="latest">최신순</option>
                <option value="vote">추천순</option>
            </select>
        </form>
    </div>
    <!-- 답변 반복 -->
    <div class="card my-3" th:each="answer : ${answerPaging}">
        <!-- 앵커: /question/detail/2#answer_5 로 오면 이 위치로 스크롤 (교재 3-11) -->
        <a th:id="|answer_${answer.id}|"></a>
        <div class="card-body">
            <div class="card-text" th:utext="${markdown.render(answer.content)}">답변 내용</div>
            <div class="d-flex justify-content-end">
                <!-- 생성 후 수정된 적이 있을 때만 수정일시 표시 (교재 3-09) -->
                <div class="badge bg-light text-dark p-2 text-start mx-3"
                     th:if="${answer.modifyDate.isAfter(answer.createDate)}">
                    <div class="mb-2">modified at</div>
                    <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="badge bg-light text-dark p-2 text-start">
                    <div class="mb-2" th:text="${answer.author?.username}">user2</div>
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <div class="my-3">
                <!-- 추천: POST 요청 (global.js), 추천 수 = voters 크기 -->
                <a th:href="@{|/answer/vote/${answer.id}|}" method="POST"
                   onclick="return confirm('정말로 추천하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">
                    추천 <span class="badge rounded-pill bg-success" th:text="${#lists.size(answer.voters)}">0</span>
                </a>
            </div>
            <div class="my-3" sec:authorize="isAuthenticated()"
                 th:if="${answer.author != null and #authentication.name == answer.author.username}">
                <a th:href="@{|/answer/modify/${answer.id}|}" class="btn btn-sm btn-outline-secondary">수정</a>
                <a th:href="@{|/answer/delete/${answer.id}|}" method="DELETE"
                   onclick="return confirm('정말로 삭제하시겠습니까?');"
                   class="btn btn-sm btn-outline-secondary">삭제</a>
            </div>
            <div th:replace="~{comment_fragment :: commentsFragment(${answer}, @{|/comment/create/answer/${answer.id}|})}"></div>
        </div>
    </div>
    <!-- 답변 페이징 -->
    <nav th:if="${answerPaging.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!answerPaging.hasPrevious} ? 'disabled'">
                <a class="page-link"
                   th:href="@{|/question/detail/${question.id}|(answerPage=${answerPaging.number - 1}, answerSort=${answerSort})}">이전</a>
            </li>
            <li th:each="page : ${#numbers.sequence(0, answerPaging.totalPages - 1)}"
                th:classappend="${page == answerPaging.number} ? 'active'" class="page-item">
                <a class="page-link" th:text="${page + 1}"
                   th:href="@{|/question/detail/${question.id}|(answerPage=${page}, answerSort=${answerSort})}">1</a>
            </li>
            <li class="page-item" th:classappend="${!answerPaging.hasNext} ? 'disabled'">
                <a class="page-link"
                   th:href="@{|/question/detail/${question.id}|(answerPage=${answerPaging.number + 1}, answerSort=${answerSort})}">다음</a>
            </li>
        </ul>
    </nav>
    <!-- 답변 작성 폼: 전송하면 POST /answer/create/{질문id} 요청이 발생한다. -->
    <form th:action="@{|/answer/create/${question.id}|}" th:object="${answerForm}" method="post" class="my-3">
        <th:block th:replace="~{form_errors :: formErrorsFragment}"></th:block>
        <!-- 로그인하지 않았으면 입력 자체를 막는다. -->
        <textarea sec:authorize="isAnonymous()" disabled class="form-control" rows="10">로그인 후 답변을 작성할 수 있습니다.</textarea>
        <textarea sec:authorize="isAuthenticated()" th:field="*{content}" rows="10" class="form-control"></textarea>
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
    </form>
</div>
</html>
