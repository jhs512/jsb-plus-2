<html layout:decorate="~{layout}">
<head>
    <title th:text="${method} ? '질문 수정' : '질문 등록'">질문 등록</title>
</head>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2" th:text="${method} ? '질문 수정' : '질문 등록'">질문 등록</h5>
    <!-- th:object: 이 안에서는 *{필드명}으로 form의 필드에 접근 (14168 22강) -->
    <!-- action을 생략하면 현재 URL(/question/create)로 전송된다. (14168 26강) -->
    <form th:object="${form}" method="post">
        <!-- th:action이 없는 폼은 CSRF 토큰이 자동으로 들어가지 않으므로 직접 넣는다. (14168 46강) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <!-- 수정 화면일 때만 _method=PUT (등록과 수정이 같은 템플릿을 쓴다) -->
        <input type="hidden" name="_method" th:if="${method}" th:value="${method}">
        <!-- 검증 에러 메시지 (정렬 + 첫 에러 필드 focus) -->
        <th:block th:replace="~{form_errors :: formErrorsFragment}"></th:block>
        <div class="mb-3">
            <label class="form-label w-100">카테고리
                <!-- th:field가 현재 값과 같은 option에 selected를 붙여 준다. -->
                <select th:field="*{category}" class="form-select">
                    <option value="">카테고리 선택</option>
                    <option th:each="c : ${categories}" th:value="${c.code}" th:text="${c.name}">질문답변</option>
                </select>
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">제목
                <!-- th:field: name, id, value 속성을 자동으로 채워 준다. 검증 실패 시 입력값이 유지된다. -->
                <input type="text" th:field="*{subject}" class="form-control" autofocus>
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label w-100">내용
                <textarea th:field="*{content}" class="form-control markdown-editor" rows="10"></textarea>
            </label>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</html>
