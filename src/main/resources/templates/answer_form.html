<html layout:decorate="~{layout}">
<head>
    <title>답변 수정</title>
</head>
<div layout:fragment="content" class="container">
    <h5 class="my-3 border-bottom pb-2">답변 수정</h5>
    <!-- action 생략: 현재 URL(/answer/modify/{id})로 전송, _method=PUT -->
    <form th:object="${answerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="_method" value="PUT">
        <th:block th:replace="~{form_errors :: formErrorsFragment}"></th:block>
        <div class="mb-3">
            <label class="form-label w-100">내용
                <textarea th:field="*{content}" class="form-control markdown-editor" rows="10"></textarea>
            </label>
        </div>
        <input type="submit" value="저장하기" class="btn btn-primary my-2">
    </form>
</div>
</html>
