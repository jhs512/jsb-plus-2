<!-- 댓글 목록 + 작성 폼 프래그먼트 (질문, 답변 공용)
     parent: 질문 또는 답변, createUrl: 작성 요청 URL -->
<div th:fragment="commentsFragment(parent, createUrl)" class="mt-3">
    <ul class="list-unstyled small border-top pt-2 mb-2" th:if="${!parent.comments.isEmpty()}">
        <li th:each="comment : ${parent.comments}" class="py-1 border-bottom">
            <span th:text="${comment.content}">댓글</span>
            <span class="text-secondary ms-1">
                - <span th:text="${comment.author?.username}">user1</span>,
                <span th:text="${#temporals.format(comment.createDate, 'yyyy-MM-dd HH:mm')}"></span>
            </span>
            <a th:if="${comment.author != null and #authentication.name == comment.author.username}"
               th:href="@{|/comment/delete/${comment.id}|}" method="DELETE"
               onclick="return confirm('댓글을 삭제하시겠습니까?');" class="text-danger ms-1">삭제</a>
        </li>
    </ul>
    <!-- onsubmit: JS로 먼저 검사하고, 통과하면 form.submit() (14168 35강) -->
    <form sec:authorize="isAuthenticated()" th:action="${createUrl}" method="post" class="input-group input-group-sm"
          onsubmit="Comment__submitWriteForm(this); return false;">
        <input type="text" name="content" class="form-control" placeholder="댓글 달기" maxlength="500">
        <button type="submit" class="btn btn-outline-secondary">등록</button>
    </form>
</div>
