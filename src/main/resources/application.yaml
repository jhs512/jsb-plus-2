spring:
  application:
    name: sbb
  output:
    ansi:
      enabled: always
  profiles:
    active: dev # 기본은 개발(dev) 프로파일, 테스트는 @ActiveProfiles("test")로 전환
  jpa:
    hibernate:
      ddl-auto: update # 엔티티 구조에 맞춰 테이블 자동 생성/수정
    show-sql: true # 실행되는 SQL 출력
    properties:
      hibernate:
        format_sql: true # SQL 줄바꿈 정렬
        highlight_sql: true # SQL 색상 강조
        use_sql_comments: true # 어떤 JPA 동작에서 나온 SQL인지 주석 표시
logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE # ? 자리에 바인딩된 실제 값 출력
    org.hibernate.orm.jdbc.extract: TRACE # 조회 결과 값 출력
    org.springframework.transaction.interceptor: TRACE # 트랜잭션 시작/종료 출력
