spring:
  config:
    # 비밀 설정 파일(있을 때만 읽음). dev 프로파일에서만 읽는다 -> 테스트·운영에 개발용 비밀값이 섞이지 않음
    # 예시는 프로젝트 루트의 application-secret.yaml.template 참고 (application-secret.yaml은 .gitignore 대상)
    import: optional:file:./application-secret.yaml
  thymeleaf:
    cache: false # 개발 중에는 템플릿 수정이 바로 반영되도록 (운영에서는 켜야 함, 14163 29강)
    prefix: file:src/main/resources/templates/ # 빌드 없이 소스 폴더의 템플릿을 바로 읽음 (14168)
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console
  datasource:
    url: jdbc:h2:./db_dev # 프로젝트 폴더의 파일 DB (재시작해도 데이터 유지)
    username: sa
    password:
    driver-class-name: org.h2.Driver
